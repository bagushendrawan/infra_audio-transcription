[project]
name = "audio-transcription"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7", "pydantic-settings>=2.4", "python-multipart>=0.0.18", "faster-whisper>=1.1", "nemo-toolkit[asr]>=2.5,<3", "numpy<2", "nltk", "ctc-forced-aligner", "deepmultilingualpunctuation", "demucs", "indic-numtowords"]

[project.optional-dependencies]
inference = []

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6"]

[tool.uv.sources]
ctc-forced-aligner = { git = "https://github.com/MahmoudAshraf97/ctc-forced-aligner.git" }
deepmultilingualpunctuation = { git = "https://github.com/oliverguhr/deepmultilingualpunctuation.git" }
demucs = { git = "https://github.com/MahmoudAshraf97/demucs.git" }
indic-numtowords = { git = "https://github.com/AI4Bharat/indic-numtowords.git" }

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
extend-exclude = ["src/transcription/vendor"]
[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
cache-dir = "../.cache/uv"
link-mode = "hardlink"
